services:
  postgres:
    image: postgres:16
    container_name: redis-sql-shop-postgres
    environment:
      POSTGRES_DB: shop_demo
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-sql-shop-redis
    ports:
      - "16379:6379"

volumes:
  postgres-data:
