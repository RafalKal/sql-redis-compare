services:
  postgres:
    image: postgres:16
    container_name: redis-sql-shop-postgres
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-shop_demo}
      POSTGRES_USER: ${APP_POSTGRES_USERNAME:-shop}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-shop}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-sql-shop-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

volumes:
  postgres-data:
